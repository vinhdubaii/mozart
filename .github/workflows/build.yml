name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate app icon from source PNG
        shell: pwsh
        run: |
          $source = "assets/source/mozart-logo-2000.png"
          if (Test-Path $source) {
            choco install imagemagick.app --no-progress -y --params "/NoLegacySupport" | Out-Null
            refreshenv
            magick convert $source -define icon:auto-resize=256,128,64,48,32,16 assets/mozart.ico
            Write-Host "Generated assets/mozart.ico from $source"
          } else {
            Write-Host "::warning::$source not found — building without an app icon (ApplicationIcon is conditional in the .csproj, so this does not fail the build)."
          }

      - name: Restore
        run: dotnet restore Mozart.csproj

      - name: Build
        run: dotnet build Mozart.csproj --configuration Release --no-restore
