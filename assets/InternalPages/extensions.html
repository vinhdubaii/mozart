<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Extensions</title>
    <link rel="stylesheet" href="shared/base.css" />
    <style>
        .ext-icon {
            width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--mozart-accent); color: #fff; font-weight: 600; font-size: 14px;
        }
        .ext-desc {
            font-size: 12px; color: var(--mozart-text-secondary);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            margin-top: 2px;
        }
        .mozart-row.ext-highlight { outline: 2px solid var(--mozart-accent); outline-offset: -2px; }
    </style>
</head>
<body>
    <main class="mozart-page">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
            <h1>Extensions</h1>
            <button id="load-unpacked-btn" class="mozart-primary">Load unpacked…</button>
        </div>
        <p class="mozart-text-secondary" style="font-size:13px;">Extensions installed from the Chrome Web Store or loaded unpacked from a folder on disk.</p>

        <div id="results" class="mozart-section"></div>
    </main>

    <script src="shared/mozart-bridge.js"></script>
    <script src="shared/mozart-page.js"></script>
    <script>
        const resultsEl = document.getElementById("results");
        const highlightId = location.hash ? decodeURIComponent(location.hash.slice(1)) : null;

        function rowHtml(ext) {
            const initial = (ext.name || "?").trim().charAt(0).toUpperCase() || "?";
            const optionsLink = ext.hasOptionsPage
                ? `<a href="${MozartPage.escapeHtml(ext.optionsPageUrl)}" style="font-size:12px;">Options</a>`
                : "";
            return `
                <div class="mozart-row${ext.id === highlightId ? " ext-highlight" : ""}" data-id="${MozartPage.escapeHtml(ext.id)}">
                    <div class="ext-icon">${MozartPage.escapeHtml(initial)}</div>
                    <div class="mozart-row-main">
                        <div class="mozart-row-title">${MozartPage.escapeHtml(ext.name)} <span class="mozart-text-secondary" style="font-weight:400;">v${MozartPage.escapeHtml(ext.version)}</span></div>
                        ${ext.description ? `<div class="ext-desc">${MozartPage.escapeHtml(ext.description)}</div>` : ""}
                        ${optionsLink}
                    </div>
                    <div class="mozart-row-actions">
                        <label class="mozart-switch" title="${ext.isEnabled ? "Disable" : "Enable"}">
                            <input type="checkbox" data-action="toggle" data-id="${MozartPage.escapeHtml(ext.id)}" ${ext.isEnabled ? "checked" : ""} />
                            <span></span>
                        </label>
                        <button data-action="remove" data-id="${MozartPage.escapeHtml(ext.id)}" class="mozart-danger">Remove</button>
                    </div>
                </div>`;
        }

        function render(items) {
            if (!items.length) {
                resultsEl.innerHTML = `<div class="mozart-surface mozart-empty">No extensions installed.</div>`;
                return;
            }
            resultsEl.innerHTML = `<div class="mozart-surface mozart-list">${items.map(rowHtml).join("")}</div>`;
            if (highlightId) {
                document.querySelector(".ext-highlight")?.scrollIntoView({ block: "center" });
            }
        }

        async function load() {
            resultsEl.innerHTML = `<p class="mozart-text-secondary">Loading…</p>`;
            try {
                render(await MozartBridge.call("extensions.getAll"));
            } catch (err) {
                resultsEl.innerHTML = `<p class="mozart-text-secondary">Couldn't load extensions: ${MozartPage.escapeHtml(err.message)}</p>`;
            }
        }

        resultsEl.addEventListener("change", async (e) => {
            const input = e.target.closest("input[data-action='toggle']");
            if (!input) return;
            const id = input.dataset.id;
            input.disabled = true;
            try {
                await MozartBridge.call("extensions.setEnabled", { id, enabled: input.checked });
            } catch (err) {
                input.checked = !input.checked;
                MozartPage.toast(`Couldn't update: ${err.message}`);
            } finally {
                input.disabled = false;
            }
        });

        resultsEl.addEventListener("click", async (e) => {
            const btn = e.target.closest("button[data-action='remove']");
            if (!btn) return;
            const row = btn.closest(".mozart-row");
            const name = row?.querySelector(".mozart-row-title")?.textContent?.trim() || "this extension";
            if (!confirm(`Remove ${name}?`)) return;
            btn.disabled = true;
            try {
                await MozartBridge.call("extensions.remove", { id: btn.dataset.id });
                row?.remove();
            } catch (err) {
                MozartPage.toast(`Couldn't remove: ${err.message}`);
                btn.disabled = false;
            }
        });

        document.getElementById("load-unpacked-btn").addEventListener("click", async () => {
            try {
                const installed = await MozartBridge.call("extensions.loadUnpacked");
                if (installed) {
                    MozartPage.toast(`Installed ${installed.name}`);
                    load();
                }
                // installed === null means the user cancelled the folder picker — nothing to do.
            } catch (err) {
                MozartPage.toast(`Couldn't load unpacked extension: ${err.message}`);
            }
        });

        load();
    </script>
</body>
</html>
