<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Password Manager</title>
    <link rel="stylesheet" href="shared/base.css" />
    <style>
        .passwords-search { position: relative; margin-bottom: 20px; }
        .passwords-search .mozart-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--mozart-text-secondary); }
        .passwords-search input { width: 100%; padding: 8px 12px 8px 38px; }
        .password-domain-group { margin-bottom: 20px; }
        .password-domain-header { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--mozart-text-secondary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
        .password-value { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; letter-spacing: .02em; }
        .icon-button { padding: 6px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border-color: transparent; }
        .icon-button:hover { background: var(--mozart-surface-alt); border-color: var(--mozart-border); }
    </style>
</head>
<body>
    <main class="mozart-page">
        <h1>Password Manager</h1>
        <p class="mozart-field-hint" style="margin: -4px 0 20px;">
            Saved logins are encrypted and tied to your Windows account on this device.
        </p>

        <div class="passwords-search">
            <span class="mozart-icon mozart-icon-search"></span>
            <input id="search-box" type="search" placeholder="Search sites or usernames" autocomplete="off" />
        </div>

        <div id="groups-container"></div>
        <div id="empty-state" class="mozart-empty" style="display:none;">No saved passwords yet.</div>
    </main>

    <script src="shared/mozart-bridge.js"></script>
    <script src="shared/mozart-page.js"></script>
    <script>
        let allEntries = [];
        const $ = (id) => document.getElementById(id);
        const container = $("groups-container");
        const emptyState = $("empty-state");

        function render() {
            const query = $("search-box").value.trim().toLowerCase();
            const filtered = !query
                ? allEntries
                : allEntries.filter((e) =>
                    e.domain.toLowerCase().includes(query) || e.username.toLowerCase().includes(query));

            if (allEntries.length === 0) {
                container.innerHTML = "";
                emptyState.style.display = "block";
                emptyState.textContent = "No saved passwords yet.";
                return;
            }
            if (filtered.length === 0) {
                container.innerHTML = "";
                emptyState.style.display = "block";
                emptyState.textContent = `No saved passwords match "${query}".`;
                return;
            }
            emptyState.style.display = "none";

            const byDomain = new Map();
            for (const entry of filtered) {
                if (!byDomain.has(entry.domain)) byDomain.set(entry.domain, []);
                byDomain.get(entry.domain).push(entry);
            }
            const domains = Array.from(byDomain.keys()).sort((a, b) => a.localeCompare(b));

            container.innerHTML = domains.map((domain) => `
                <div class="password-domain-group">
                    <div class="password-domain-header">
                        <span class="mozart-favicon"></span>${MozartPage.escapeHtml(domain)}
                    </div>
                    <div class="mozart-surface mozart-list">
                        ${byDomain.get(domain)
                            .sort((a, b) => a.username.localeCompare(b.username))
                            .map(rowHtml)
                            .join("")}
                    </div>
                </div>
            `).join("");

            container.querySelectorAll("[data-reveal-id]").forEach((btn) => {
                btn.addEventListener("click", () => onReveal(Number(btn.dataset.revealId)));
            });
            container.querySelectorAll("[data-delete-id]").forEach((btn) => {
                btn.addEventListener("click", () => onDelete(Number(btn.dataset.deleteId)));
            });
        }

        function rowHtml(entry) {
            const isRevealed = entry._revealed === true;
            const passwordText = isRevealed ? MozartPage.escapeHtml(entry._plaintext || "") : "••••••••";
            return `
                <div class="mozart-row">
                    <div class="mozart-row-main">
                        <div class="mozart-row-title">${MozartPage.escapeHtml(entry.username)}</div>
                        <div class="mozart-row-sub password-value">${passwordText}</div>
                    </div>
                    <div class="mozart-row-actions">
                        <button class="icon-button" title="${isRevealed ? "Hide password" : "Show password"}" data-reveal-id="${entry.id}">
                            <span class="mozart-icon ${isRevealed ? "mozart-icon-eye-off" : "mozart-icon-eye"}"></span>
                        </button>
                        <button class="icon-button mozart-danger" title="Delete" data-delete-id="${entry.id}">
                            <span class="mozart-icon mozart-icon-trash"></span>
                        </button>
                    </div>
                </div>
            `;
        }

        async function onReveal(id) {
            const entry = allEntries.find((e) => e.id === id);
            if (!entry) return;

            if (entry._revealed) {
                entry._revealed = false;
                entry._plaintext = null;
                render();
                return;
            }

            try {
                const r = await MozartBridge.call("passwords.reveal", { id });
                entry._revealed = true;
                entry._plaintext = r.password;
                render();
            } catch (err) {
                MozartPage.toast(`Couldn't reveal password: ${err.message}`);
            }
        }

        async function onDelete(id) {
            const entry = allEntries.find((e) => e.id === id);
            if (!entry) return;
            if (!confirm(`Delete the saved password for "${entry.username}" on ${entry.domain}?`)) return;

            try {
                await MozartBridge.call("passwords.delete", { id });
                allEntries = allEntries.filter((e) => e.id !== id);
                render();
            } catch (err) {
                MozartPage.toast(`Couldn't delete: ${err.message}`);
            }
        }

        async function init() {
            allEntries = await MozartBridge.call("passwords.getAll");
            render();
            $("search-box").addEventListener("input", render);
        }

        init();
    </script>
</body>
</html>
